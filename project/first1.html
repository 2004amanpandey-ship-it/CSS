<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotstar Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">Disney+ Hotstar</div>

        <ul>
            <li>Home</li>
            <li>TV</li>
            <li>Movies</li>
            <li>Sports</li>
            <li>Kids</li>
        </ul>

        <button>Subscribe</button>
    </nav>

    <section class="hero">
        <div class="overlay">
            <h1>Avengers: Endgame</h1>

            <p>
                After the devastating events of Infinity War,
                the Avengers assemble once again to reverse
                Thanos' actions and restore balance.
            </p>

            <button>Watch Now</button>
        </div>
    </section>

    <section class="movies">
        <h2>Trending Movies</h2>

        <div class="movie-container">

            <div class="card">
                <img src="https://picsum.photos/250/350?1" alt="">
                <h3>Movie One</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/250/350?2" alt="">
                <h3>Movie Two</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/250/350?3" alt="">
                <h3>Movie Three</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/250/350?4" alt="">
                <h3>Movie Four</h3>
            </div>

        </div>
    </section>

</body>
</html>
